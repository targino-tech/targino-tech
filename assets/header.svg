<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Théo Targino</title>
  <desc id="d">Analista de Sistemas de TI Pleno: infraestrutura, redes, segurança e observabilidade.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-weight: 800; font-size: 76px; letter-spacing: 6px; fill: #39FF14; filter: url(#glow); }
    .role { font-size: 19px; fill: #E6E6E6; letter-spacing: 1px; }
    .dim { font-size: 15px; fill: #7a7a7a; letter-spacing: 2px; }
    .prompt { font-size: 17px; fill: #39FF14; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 6s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(320px) } }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .cursor, .scan, .dot { animation: none } .scan { display: none } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f1f0f" stroke-width="1"/></pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#39FF14" stop-opacity=".16"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#39FF14" stop-opacity="0"/><stop offset=".5" stop-color="#39FF14" stop-opacity=".12"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#000"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#halo)"/>
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="url(#beam)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#1d3a1d" stroke-width="2"/>
  <!-- barra de janela de terminal -->
  <circle cx="34" cy="30" r="6" fill="#2a2a2a"/><circle cx="54" cy="30" r="6" fill="#2a2a2a"/><circle class="dot" cx="74" cy="30" r="6" fill="#39FF14"/>
  <text class="mono dim" x="1166" y="35" text-anchor="end">~/targino-tech</text>
  <text class="mono prompt" x="600" y="86" text-anchor="middle">$ whoami</text>
  <text class="mono name" x="600" y="168" text-anchor="middle">THÉO TARGINO</text>
  <text class="mono role" x="600" y="212" text-anchor="middle">Analista de Sistemas de TI Pleno</text>
  <text class="mono dim" x="600" y="248" text-anchor="middle">INFRA · REDES · SEGURANÇA · OBSERVABILIDADE · SOC</text>
  <rect class="cursor" x="884" y="232" width="10" height="20" fill="#39FF14"/>
</svg>
